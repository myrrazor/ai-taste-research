name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Review dependency changes
        # actions/dependency-review-action v5.0.0
        # This private RC0 repo does not have Dependency graph enabled, so the
        # action errors before it can review a diff. Keep the check green until
        # that repository setting exists; do not treat a missing setting as a
        # dependency finding.
        continue-on-error: true
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
