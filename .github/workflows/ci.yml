name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - testing
      - dev
      - "chore/**"
      - "feat/**"
      - "fix/**"
      - "docs/**"

permissions:
  contents: read

jobs:
  source-test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        # actions/checkout v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        # actions/setup-python v6.2.0
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ruff lint
        run: ruff check src tests

      - name: Strict type check
        run: mypy

      - name: Coverage test suite
        run: |
          coverage run -m unittest discover -s tests
          coverage report

  canonical-artifact:
    name: Canonical artifact
    needs: source-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.14"

      - name: Build wheel and sdist once
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m build
          PYTHONPATH=src python -m nanotaste.rc0.artifacts create \
            --dist-dir dist \
            --source-sha "${GITHUB_SHA}" \
            --output dist/ARTIFACT_MANIFEST.json
          PYTHONPATH=src python -m nanotaste.rc0.artifacts verify \
            --dist-dir dist \
            --manifest dist/ARTIFACT_MANIFEST.json

      - name: Verify sdist install
        run: |
          python -m venv .venv-sdist
          . .venv-sdist/bin/activate
          python -m pip install dist/*.tar.gz
          nanotaste --help

      - name: Upload canonical package artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-package
          path: dist/
          if-no-files-found: error
          retention-days: 14

  artifact-install:
    name: Artifact install / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: canonical-artifact
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download canonical package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: canonical-package
          path: dist

      - name: Verify and install exact wheel
        run: |
          PYTHONPATH=src python -m nanotaste.rc0.artifacts verify \
            --dist-dir dist \
            --manifest dist/ARTIFACT_MANIFEST.json
          python -m venv .venv-smoke
          if [ -f .venv-smoke/bin/activate ]; then
            . .venv-smoke/bin/activate
          else
            . .venv-smoke/Scripts/activate
          fi
          python -m pip install dist/*.whl

      - name: Complete installed CLI smoke
        run: |
          if [ -f .venv-smoke/bin/activate ]; then
            . .venv-smoke/bin/activate
          else
            . .venv-smoke/Scripts/activate
          fi
          nanotaste --help
          nanotaste run --domain design --prompt "Design a landing page" \
            --taste-file examples/TASTE.example.md --no-record --json
          mkdir -p .nanotaste/ci-smoke/candidates
          printf 'This seamlessly empowers teams.' > .nanotaste/ci-smoke/candidates/a.md
          printf 'Compare three concrete drafts.' > .nanotaste/ci-smoke/candidates/b.md
          printf 'This platform empowers teams.' > .nanotaste/ci-smoke/before.md
          printf 'Compare three drafts.' > .nanotaste/ci-smoke/after.md
          nanotaste compare --domain writing --prompt "Write a launch note" \
            --taste-file examples/TASTE.example.md \
            --candidates .nanotaste/ci-smoke/candidates/a.md \
              .nanotaste/ci-smoke/candidates/b.md --no-record --json
          nanotaste propose-update --domain writing \
            --before .nanotaste/ci-smoke/before.md \
            --after .nanotaste/ci-smoke/after.md \
            --output-dir .nanotaste/ci-smoke/updates --json
          nanotaste calibrate prepare --taste-file examples/TASTE.example.md \
            --prompt-set data/calibration/starter_prompts.json \
            --output-dir .nanotaste/ci-smoke/calibration --json
          nanotaste calibrate evaluate \
            --run .nanotaste/ci-smoke/calibration/starter_run.json \
            --picks .nanotaste/ci-smoke/calibration/human_picks.json \
            --output .nanotaste/ci-smoke/calibration/evaluation.md --json
          mkdir -p /tmp/nanotaste-ci-home/.cursor/projects/demo
          printf '%s\n' '{"text":"Build a small parser and return scores with reasons."}' \
            > /tmp/nanotaste-ci-home/.cursor/projects/demo/chat-session.jsonl
          nanotaste sources --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --json
          nanotaste setup --yes --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --every weekly --json
          nanotaste like examples/likes/concrete-release-note.md \
            --workspace .nanotaste/ci-smoke/workspace --home /tmp/nanotaste-ci-home --json
          nanotaste unlike examples/unlikes/generic-ai-prose.md \
            --workspace .nanotaste/ci-smoke/workspace --home /tmp/nanotaste-ci-home --json
          nanotaste pick --prompt "Write a launch note" \
            --candidate "Run three concrete drafts and record the decision." \
            --candidate "This seamlessly empowers teams." \
            --choose 1 --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --json
          nanotaste harvest --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --json
          nanotaste report --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --json
          nanotaste schedule --every weekly --workspace .nanotaste/ci-smoke/workspace \
            --home /tmp/nanotaste-ci-home --json

  artifact-smoke:
    name: Artifact smoke
    if: always()
    needs: artifact-install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every artifact install
        env:
          RESULT: ${{ needs.artifact-install.result }}
        run: test "${RESULT}" = "success"
